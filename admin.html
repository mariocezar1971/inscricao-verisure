<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Inscrições · Verisure</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1729; --ink-soft:#334155; --muted:#647089; --paper:#F4F6FA;
    --card:#FFFFFF; --line:#E4E9F1; --navy:#132542; --navy-2:#0B1526;
    --amber:#E8A33D; --amber-deep:#C7841F; --teal:#2C8C89; --red:#C0392B;
    --shadow:0 18px 48px -24px rgba(15,23,41,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#E9EEF6; --ink-soft:#B9C5D8; --muted:#8598B2; --paper:#0A111E;
      --card:#131E33; --line:#233248; --navy:#0E1B30; --navy-2:#070E1B; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace}
  a{color:var(--amber-deep)}

  /* Login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .login .top{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:26px 26px 22px}
  .login .top .mono{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
  .login h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;margin:8px 0 0}
  .login .body{padding:22px 26px 26px;display:grid;gap:12px}
  label{font-size:13px;font-weight:600;color:var(--ink-soft)}
  input[type=password],input[type=search],input[type=text]{font:inherit;font-size:15px;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;width:100%}
  input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(232,163,61,.16)}
  .btn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;
    background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#20160A;padding:12px 18px;border-radius:11px}
  .btn:disabled{opacity:.6;cursor:progress}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft)}
  .btn.small{font-size:13px;padding:8px 13px;border-radius:9px}
  .err{color:var(--red);font-size:13px;min-height:1em}

  /* App */
  .app{max-width:1120px;margin:0 auto;padding:22px}
  header.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .title{display:flex;align-items:center;gap:12px}
  .title .mk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#241706;
    background:linear-gradient(160deg,var(--amber),var(--amber-deep));font-family:"Bricolage Grotesque",sans-serif;font-weight:800}
  .title h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;margin:0}
  .title p{margin:0;color:var(--muted);font-size:12.5px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:640px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;line-height:1}
  .stat .l{color:var(--muted);font-size:12.5px;margin-top:6px}
  .stat .bar{height:7px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
  .stat .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber))}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .grow{flex:1;min-width:180px}

  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:820px;font-size:13.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  tr:hover td{background:rgba(232,163,61,.05)}
  td .nm{font-weight:600}
  td.time{white-space:nowrap;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:12px}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
  .badge.ok{background:rgba(44,140,137,.14);color:var(--teal)}
  .badge.no{background:rgba(192,57,43,.12);color:var(--red)}
  .del{appearance:none;border:1px solid var(--line);background:transparent;color:var(--red);cursor:pointer;
    border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
  .del:hover{background:rgba(192,57,43,.08)}
  .empty,.loading{padding:40px;text-align:center;color:var(--muted)}
  .edit{appearance:none;border:1px solid var(--line);background:transparent;color:var(--amber-deep);cursor:pointer;
    border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;margin-right:6px}
  .edit:hover{background:rgba(232,163,61,.08)}

  /* Modal de edição */
  .overlay{position:fixed;inset:0;background:rgba(10,17,30,.55);display:grid;place-items:center;padding:20px;z-index:50}
  .modal{width:100%;max-width:470px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .modal .mhead{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:18px 22px}
  .modal .mhead h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;margin:0}
  .modal .mbody{padding:20px 22px;display:grid;gap:12px;max-height:66vh;overflow:auto}
  .modal .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.modal .frow{grid-template-columns:1fr}}
  .modal .fld{display:grid;gap:5px}
  .modal textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:64px;resize:vertical}
  .modal textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(232,163,61,.16)}
  .modal .chk{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-soft)}
  .modal .chk input{width:auto;transform:scale(1.15);accent-color:var(--amber-deep)}
  .modal .merr{color:var(--red);font-size:13px;min-height:1em;padding:2px 22px 0}
  .modal .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
  .modal select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%}
  .modal select:focus{outline:none;border-color:var(--amber)}

  /* Barra de certificados */
  .certbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px}
  .certbar .lbl{font-weight:700;font-size:13px;color:var(--ink-soft)}
  .certbar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .certbar input{width:132px;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
  .certbar input.sm{width:90px}
  .certbar input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.14)}
  .certbar .spacer{flex:1}
  .cert{appearance:none;border:1px solid var(--line);background:transparent;color:var(--teal);cursor:pointer;
    border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;margin-right:6px}
  .cert:hover{background:rgba(44,140,137,.08)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login">
  <div class="box">
    <div class="top">
      <div class="mono">Verisure · Área restrita</div>
      <h1>Painel de inscrições</h1>
    </div>
    <div class="body">
      <div>
        <label for="tok">Token de acesso</label>
        <input type="password" id="tok" placeholder="cole o token" autocomplete="current-password">
      </div>
      <button class="btn" id="enter">Entrar</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>
</section>

<!-- APP -->
<main class="app" id="app" hidden>
  <header class="bar">
    <div class="title">
      <span class="mk">V</span>
      <div>
        <h1>Inscrições — Workshop Verisure</h1>
        <p>Atualizado em <span id="updated">—</span></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost small" id="refresh">↻ Atualizar</button>
      <button class="btn small" id="csv">⭳ Exportar CSV</button>
      <button class="btn ghost small" id="logout">Sair</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="l">inscritos</div>
      <div class="bar"><i id="stBar" style="width:0%"></i></div></div>
    <div class="stat"><div class="n" id="stRest">20</div><div class="l">vagas restantes (de 20)</div></div>
    <div class="stat"><div class="n" id="stConsent">0</div><div class="l">com consentimento LGPD</div></div>
  </div>

  <div class="toolbar">
    <div class="grow"><input type="search" id="search" placeholder="Buscar por nome, e-mail, equipe…"></div>
    <span class="mono" style="color:var(--muted);font-size:12px" id="showing"></span>
  </div>

  <div class="certbar">
    <span class="lbl">Certificado</span>
    <label>Data do evento <input type="text" id="certData" placeholder="dd/mm/aaaa"></label>
    <label>Local <input type="text" id="certLocal" placeholder="cidade / local"></label>
    <label>Carga horária <input type="text" id="certCarga" class="sm" value="8 horas"></label>
    <span class="spacer"></span>
    <button class="btn ghost small" id="emitAll">⎙ Emitir todos</button>
  </div>

  <div class="tablewrap">
    <div class="loading" id="loading">Carregando…</div>
    <table id="table" hidden>
      <thead>
        <tr>
          <th>#</th><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Equipe</th>
          <th>Unidade</th><th>Nível</th><th>LGPD</th><th>Data</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Nenhuma inscrição ainda.</div>
  </div>
</main>

<!-- Modal de edição -->
<div class="overlay" id="editOverlay" hidden>
  <div class="modal">
    <div class="mhead"><h2>Editar inscrição</h2></div>
    <div class="mbody">
      <div class="fld"><label for="e_nome">Nome *</label><input type="text" id="e_nome"></div>
      <div class="fld"><label for="e_nome_certificado">Nome no certificado</label><input type="text" id="e_nome_certificado"></div>
      <div class="frow">
        <div class="fld"><label for="e_email">E-mail *</label><input type="text" id="e_email"></div>
        <div class="fld"><label for="e_cpf">CPF</label><input type="text" id="e_cpf"></div>
      </div>
      <div class="frow">
        <div class="fld"><label for="e_telefone">Telefone</label><input type="text" id="e_telefone"></div>
        <div class="fld"><label for="e_unidade">Unidade</label><input type="text" id="e_unidade"></div>
      </div>
      <div class="frow">
        <div class="fld"><label for="e_cargo">Cargo</label><input type="text" id="e_cargo"></div>
        <div class="fld"><label for="e_equipe">Equipe</label><input type="text" id="e_equipe"></div>
      </div>
      <div class="fld"><label for="e_nivel">Nível</label>
        <select id="e_nivel"><option value="">—</option><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select>
      </div>
      <div class="fld"><label for="e_expectativa">Desafio / expectativa</label><textarea id="e_expectativa"></textarea></div>
      <div class="frow">
        <div class="fld"><label for="e_acessibilidade">Acessibilidade</label><input type="text" id="e_acessibilidade"></div>
        <div class="fld"><label for="e_restricao">Restrição alimentar</label><input type="text" id="e_restricao"></div>
      </div>
      <label class="chk"><input type="checkbox" id="e_consent"> Consentimento LGPD</label>
      <label class="chk"><input type="checkbox" id="e_consent_img"> Autoriza uso de imagem</label>
    </div>
    <div class="merr" id="editErr"></div>
    <div class="mfoot">
      <button class="btn ghost small" id="editCancel">Cancelar</button>
      <button class="btn small" id="editSave">Salvar</button>
    </div>
  </div>
</div>

<script>
  const API = "https://ssolrvckfnchrwpnvegb.supabase.co/functions/v1/admin-inscricoes";
  const SEATS = 20;
  const KEY = "verisure_admin_token";
  let ROWS = [];

  const $ = (id) => document.getElementById(id);
  const getToken = () => { try { return sessionStorage.getItem(KEY) || ""; } catch(e){ return ""; } };
  const setToken = (t) => { try { sessionStorage.setItem(KEY, t); } catch(e){} };
  const clearToken = () => { try { sessionStorage.removeItem(KEY); } catch(e){} };

  async function api(action, extra){
    const r = await fetch(API, {
      method:"POST",
      headers:{ "content-type":"application/json", "x-admin-token": getToken() },
      body: JSON.stringify(Object.assign({ action }, extra||{})),
    });
    if(r.status === 401){ const e = new Error("unauthorized"); e.code = 401; throw e; }
    const out = await r.json().catch(()=>({ok:false}));
    if(!out.ok) throw new Error(out.error || "erro");
    return out;
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
  function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso);
    return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }

  function render(){
    const q = ($("search").value||"").trim().toLowerCase();
    const filtered = !q ? ROWS : ROWS.filter(r =>
      [r.nome,r.nome_certificado,r.email,r.cpf,r.cargo,r.equipe,r.unidade,r.telefone].some(v => String(v||"").toLowerCase().includes(q)));

    const tbody = $("tbody");
    tbody.innerHTML = filtered.map((r,i)=>`
      <tr>
        <td class="mono" style="color:var(--muted)">${i+1}</td>
        <td class="nm">${esc(r.nome)}</td>
        <td><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></td>
        <td>${esc(r.cargo)||"—"}</td>
        <td>${esc(r.equipe)||"—"}</td>
        <td>${esc(r.unidade)||"—"}</td>
        <td>${esc(r.nivel)||"—"}</td>
        <td>${r.consentimento_lgpd?'<span class="badge ok">sim</span>':'<span class="badge no">não</span>'}</td>
        <td class="time">${fmtDate(r.created_at)}</td>
        <td><button class="cert" data-id="${esc(r.id)}">certificado</button><button class="edit" data-id="${esc(r.id)}">editar</button><button class="del" data-id="${esc(r.id)}" data-nome="${esc(r.nome)}">excluir</button></td>
      </tr>`).join("");

    $("table").hidden = filtered.length === 0;
    $("empty").hidden = filtered.length !== 0;
    $("empty").textContent = ROWS.length === 0 ? "Nenhuma inscrição ainda." : "Nenhum resultado para a busca.";
    $("showing").textContent = q ? (filtered.length + " de " + ROWS.length) : (ROWS.length + " inscrito(s)");

    tbody.querySelectorAll(".del").forEach(b => b.addEventListener("click", ()=>del(b.dataset.id, b.dataset.nome)));
    tbody.querySelectorAll(".edit").forEach(b => b.addEventListener("click", ()=>openEdit(b.dataset.id)));
    tbody.querySelectorAll(".cert").forEach(b => b.addEventListener("click", ()=>openCert(b.dataset.id)));
  }

  // ---------- Certificados ----------
  const CFG_KEY = "verisure_cert_cfg";
  function cfg(){ return { data:$("certData").value.trim(), local:$("certLocal").value.trim(), carga:$("certCarga").value.trim()||"8 horas" }; }
  function loadCfg(){
    let c = {}; try { c = JSON.parse(localStorage.getItem(CFG_KEY) || "{}"); } catch(e){}
    $("certData").value = c.data || ""; $("certLocal").value = c.local || ""; $("certCarga").value = c.carga || "8 horas";
  }
  function saveCfg(){ try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg())); } catch(e){} }

  function certStyles(){
    return '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">'
      + `<style>
      @page{ size: A4 landscape; margin:0 }
      *{box-sizing:border-box} html,body{margin:0}
      body{ background:#5b6472; font-family:"IBM Plex Sans",system-ui,sans-serif }
      .printbtn{ position:fixed; top:16px; right:16px; z-index:9; border:none; cursor:pointer; font-weight:700; font-size:15px;
        background:linear-gradient(180deg,#E8A33D,#C7841F); color:#20160A; padding:11px 16px; border-radius:10px; box-shadow:0 10px 24px -10px rgba(0,0,0,.5) }
      .cert-page{ width:297mm; height:210mm; background:#fff; margin:0 auto; padding:12mm; page-break-after:always; display:flex }
      .cert-frame{ flex:1; border:2px solid #132542; border-radius:6px; padding:14mm 20mm; position:relative;
        display:flex; flex-direction:column; align-items:center; text-align:center }
      .cert-frame::before{ content:""; position:absolute; inset:5mm; border:1px solid #E8A33D; border-radius:3px; pointer-events:none }
      .cert-top{ display:flex; align-items:center; gap:12px; color:#647089 }
      .cert-top .seal{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff;
        background:linear-gradient(150deg,#E8A33D,#C7841F); font-size:16px }
      .cert-top .mono{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase }
      .cert-frame h1{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; color:#132542; font-size:32px; letter-spacing:.02em; margin:12mm 0 6mm }
      .lead{ color:#647089; font-size:15px; margin:0 }
      .name{ font-family:"Bricolage Grotesque",sans-serif; font-weight:800; color:#0E1729; font-size:38px; margin:4mm 0 4mm; border-bottom:2px solid #E8A33D; padding:0 10mm 4mm }
      .cpf{ color:#647089; font-size:13px; font-family:"IBM Plex Mono",monospace; margin:0 0 4mm }
      .txt{ color:#33415A; font-size:17px; line-height:1.65; max-width:215mm; margin:0 }
      .cert-foot{ margin-top:auto; width:100%; display:flex; justify-content:center; padding-top:10mm }
      .sign{ text-align:center }
      .sign-line{ width:80mm; border-top:1.5px solid #33415A; margin:0 auto 5px }
      .sign-name{ font-weight:700; color:#0E1729; font-size:15px }
      .sign-sub{ color:#647089; font-size:11.5px; font-family:"IBM Plex Mono",monospace }
      @media print{ .printbtn{ display:none } body{ background:#fff } }
    </style>`;
  }
  function certCard(r, c){
    const data = c.data ? esc(c.data) : "____/____/______";
    const local = c.local ? (", em " + esc(c.local)) : "";
    const carga = esc(c.carga || "8 horas");
    return `<section class="cert-page"><div class="cert-frame">
        <div class="cert-top"><span class="seal">★</span><span class="mono">Workshop de Capacitação · ${carga}</span></div>
        <h1>CERTIFICADO DE PARTICIPAÇÃO</h1>
        <p class="lead">Certificamos que</p>
        <p class="name">${esc(r.nome_certificado || r.nome)}</p>
        ${r.cpf ? `<p class="cpf">CPF: ${esc(r.cpf)}</p>` : ""}
        <p class="txt">participou do <b>Workshop de Capacitação</b>, abrangendo os temas <b>Gestão da Qualidade Total</b>, <b>Buyer Focusing Selling</b>, <b>Storytelling</b> e <b>Project Model Canvas</b>, com carga horária de <b>${carga}</b>, realizado em <b>${data}</b>${local}.</p>
        <div class="cert-foot"><div class="sign"><div class="sign-line"></div><div class="sign-name">Prof. Dr. Mário Cezar</div><div class="sign-sub">Instrutor · ORCID 0009-0001-0411-8191</div></div></div>
      </div></section>`;
  }
  function openCertDoc(cards){
    const html = '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Certificado — Workshop Verisure</title>'
      + certStyles() + '</head><body><button class="printbtn" onclick="window.print()">⎙ Imprimir / Salvar PDF</button>' + cards + '</body></html>';
    const w = window.open("", "_blank");
    if(!w){ alert("Permita pop-ups neste site para gerar o certificado."); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }
  function openCert(id){ const r = ROWS.find(x=>String(x.id)===String(id)); if(!r) return; openCertDoc(certCard(r, cfg())); }
  function emitAll(){
    if(ROWS.length===0){ alert("Não há inscritos para emitir certificados."); return; }
    if(!confirm("Gerar certificados de todos os " + ROWS.length + " inscritos para impressão?")) return;
    openCertDoc(ROWS.map(r=>certCard(r, cfg())).join(""));
  }

  let editingId = null;
  function openEdit(id){
    const r = ROWS.find(x => String(x.id) === String(id));
    if(!r) return;
    editingId = id;
    $("e_nome").value = r.nome || "";
    $("e_email").value = r.email || "";
    $("e_telefone").value = r.telefone || "";
    $("e_cargo").value = r.cargo || "";
    $("e_equipe").value = r.equipe || "";
    $("e_nome_certificado").value = r.nome_certificado || "";
    $("e_cpf").value = r.cpf || "";
    $("e_unidade").value = r.unidade || "";
    $("e_nivel").value = r.nivel || "";
    $("e_acessibilidade").value = r.acessibilidade || "";
    $("e_restricao").value = r.restricao_alimentar || "";
    $("e_expectativa").value = r.expectativa || "";
    $("e_consent").checked = !!r.consentimento_lgpd;
    $("e_consent_img").checked = !!r.consentimento_imagem;
    $("editErr").textContent = "";
    $("editOverlay").hidden = false;
  }
  function closeEdit(){ $("editOverlay").hidden = true; editingId = null; }
  async function saveEdit(){
    if(!editingId) return;
    const payload = {
      id: editingId,
      nome: $("e_nome").value.trim(),
      email: $("e_email").value.trim(),
      telefone: $("e_telefone").value.trim(),
      cargo: $("e_cargo").value.trim(),
      equipe: $("e_equipe").value.trim(),
      nome_certificado: $("e_nome_certificado").value.trim(),
      cpf: $("e_cpf").value.trim(),
      unidade: $("e_unidade").value.trim(),
      nivel: $("e_nivel").value,
      acessibilidade: $("e_acessibilidade").value.trim(),
      restricao_alimentar: $("e_restricao").value.trim(),
      expectativa: $("e_expectativa").value.trim(),
      consentimento_lgpd: $("e_consent").checked,
      consentimento_imagem: $("e_consent_img").checked,
    };
    if(!payload.nome){ $("editErr").textContent = "O nome não pode ficar vazio."; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(payload.email)){ $("editErr").textContent = "Informe um e-mail válido."; return; }
    $("editSave").disabled = true; $("editErr").textContent = "";
    try{
      await api("update", payload);
      closeEdit(); await load();
    }catch(e){
      if(e.code === 401){ logout("Sessão expirada."); }
      else { $("editErr").textContent = "Não foi possível salvar. Tente novamente."; }
    }finally{ $("editSave").disabled = false; }
  }

  function updateStats(){
    const total = ROWS.length;
    const consent = ROWS.filter(r=>r.consentimento_lgpd).length;
    $("stTotal").textContent = total;
    $("stRest").textContent = Math.max(0, SEATS-total);
    $("stConsent").textContent = consent;
    $("stBar").style.width = Math.min(100, Math.round(total/SEATS*100)) + "%";
    $("updated").textContent = new Date().toLocaleString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }

  async function load(){
    $("loading").hidden = false; $("table").hidden = true; $("empty").hidden = true;
    try{
      const out = await api("list");
      ROWS = out.rows || [];
      updateStats(); render();
    }catch(e){
      if(e.code === 401){ logout("Token inválido — entre novamente."); return; }
      $("empty").hidden = false; $("empty").textContent = "Erro ao carregar. Tente Atualizar.";
    }finally{
      $("loading").hidden = true;
    }
  }

  async function del(id, nome){
    if(!confirm("Excluir a inscrição de "+nome+"?\n(esta ação atende ao direito de exclusão da LGPD e não pode ser desfeita)")) return;
    try{ await api("delete", { id }); await load(); }
    catch(e){ if(e.code===401){ logout("Sessão expirada."); } else alert("Não foi possível excluir. Tente novamente."); }
  }

  function toCSV(rows){
    const cols = ["nome","nome_certificado","cpf","email","telefone","cargo","equipe","unidade","nivel","expectativa","acessibilidade","restricao_alimentar","consentimento_lgpd","consentimento_imagem","created_at"];
    const head = cols.join(";");
    const esc = v => { const s = String(v==null?"":v).replace(/"/g,'""'); return /[;"\n]/.test(s) ? '"'+s+'"' : s; };
    const body = rows.map(r => cols.map(c => esc(r[c])).join(";")).join("\r\n");
    return "﻿" + head + "\r\n" + body; // BOM p/ Excel
  }
  function exportCSV(){
    const blob = new Blob([toCSV(ROWS)], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "inscricoes_verisure_" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }

  function showApp(){ $("login").hidden = true; $("app").hidden = false; loadCfg(); load(); }
  function logout(msg){
    clearToken(); ROWS = [];
    $("app").hidden = true; $("login").hidden = false;
    $("tok").value = ""; $("loginErr").textContent = msg || "";
  }

  async function tryLogin(){
    const t = $("tok").value.trim();
    if(!t){ $("loginErr").textContent = "Cole o token."; return; }
    setToken(t);
    $("enter").disabled = true; $("loginErr").textContent = "";
    try{ await api("list"); showApp(); }
    catch(e){ clearToken(); $("loginErr").textContent = "Token inválido."; }
    finally{ $("enter").disabled = false; }
  }

  $("enter").addEventListener("click", tryLogin);
  $("tok").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
  $("refresh").addEventListener("click", load);
  $("csv").addEventListener("click", exportCSV);
  $("logout").addEventListener("click", ()=>logout(""));
  $("search").addEventListener("input", render);
  $("editCancel").addEventListener("click", closeEdit);
  $("editSave").addEventListener("click", saveEdit);
  $("editOverlay").addEventListener("click", (e)=>{ if(e.target === $("editOverlay")) closeEdit(); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && !$("editOverlay").hidden) closeEdit(); });
  $("emitAll").addEventListener("click", emitAll);
  ["certData","certLocal","certCarga"].forEach(id => $(id).addEventListener("change", saveCfg));

  // auto-login se já houver token na sessão
  if(getToken()) showApp();
</script>
</body>
</html>
