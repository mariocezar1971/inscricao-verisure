<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gráfico de Controle · Ferramentas Verisure</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0E1729; --ink-2:#33415A; --muted:#647089; --paper:#F4F6FA; --card:#FFFFFF; --line:#E4E9F1;
    --navy:#132542; --amber:#E8A33D; --amber-deep:#C7841F; --teal:#2C8C89; --red:#C0392B; --green:#4E9A51; --shadow:0 16px 40px -22px rgba(15,23,41,.35); }
  @media (prefers-color-scheme: dark){ :root{ --ink:#E9EEF6; --ink-2:#B9C5D8; --muted:#8598B2; --paper:#0A111E; --card:#131E33; --line:#233248; --navy:#0E1B30; } }
  *{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:1160px;margin:0 auto;padding:20px}
  h1{font-family:"Bricolage Grotesque",sans-serif;margin:0;font-size:20px}
  header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:rgba(44,140,137,.15);color:var(--teal)}
  .brand p{margin:0;color:var(--muted);font-size:12.5px}
  .grpbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .grpbar label{font-size:12px;color:var(--muted);font-weight:600}
  .grpbar input{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--ink);width:150px}
  .grpbar input:focus{outline:none;border-color:var(--amber)}
  #status{font-size:12px;color:var(--muted);min-width:80px}
  .btn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:10px 14px}
  .btn.primary{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#20160A}
  .btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink-2)}
  .btn.sm{font-size:13px;padding:9px 11px}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .card .bd{padding:14px 16px}
  .fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .fld label{font-size:11px;font-weight:700;color:var(--muted)}
  .fld input,.fld textarea{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink)}
  .fld textarea{min-height:120px;resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.5}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--amber)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .stat .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
  .stat.lc .v{color:var(--navy)} .stat.ucl .v{color:var(--red)} .stat.lcl .v{color:var(--red)} .stat.n .v{color:var(--teal)}
  .chartcard .bd{padding:8px}
  canvas{width:100%;height:auto;display:block}
  .alerta{margin:8px 16px 0;font-size:13px;padding:8px 10px;border-radius:9px}
  .alerta.ok{background:rgba(78,154,81,.12);color:var(--green)}
  .alerta.bad{background:rgba(192,57,43,.12);color:var(--red);font-weight:600}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .foot{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}
  @media print{ .noprint{display:none!important} body{background:#fff} .grid{grid-template-columns:1fr} .card{box-shadow:none;border:none} @page{size:A4 landscape;margin:12mm} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div class="brand"><span class="mk">📈</span><div><h1>Gráfico de Controle</h1><p>O processo está estável? · Bloco GQT</p></div></div>
    <div class="grpbar"><label for="grupo">Grupo</label><input id="grupo" placeholder="Ex.: Grupo Azul" autocomplete="off"><span id="status"></span></div>
  </header>

  <div class="grid">
    <section class="card noprint">
      <div class="bd">
        <div class="fld"><label for="rotulo">O que estamos medindo?</label>
          <input id="rotulo" placeholder="Ex.: Tempo de atendimento (min)"></div>
        <div class="fld"><label for="valores">Medições (uma por linha ou separadas por vírgula)</label>
          <textarea id="valores" placeholder="12&#10;14&#10;11&#10;13&#10;22&#10;12"></textarea></div>
        <div class="stats">
          <div class="stat n"><div class="k">Amostras (n)</div><div class="v" id="sN">0</div></div>
          <div class="stat lc"><div class="k">Média (LC)</div><div class="v" id="sLC">–</div></div>
          <div class="stat ucl"><div class="k">LSC (+3σ)</div><div class="v" id="sUCL">–</div></div>
          <div class="stat lcl"><div class="k">LIC (−3σ)</div><div class="v" id="sLCL">–</div></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="salvar">Salvar</button>
          <button class="btn ghost sm" id="carregar">Carregar</button>
          <button class="btn ghost sm" id="png">PNG</button>
          <button class="btn ghost sm" id="imprimir">PDF</button>
          <button class="btn ghost sm" id="limpar">Limpar</button>
        </div>
      </div>
    </section>

    <section class="card chartcard">
      <div class="bd"><canvas id="chart" width="900" height="500"></canvas></div>
      <div class="alerta ok" id="alerta" hidden></div>
    </section>
  </div>
  <p class="foot noprint">Ferramentas do Workshop · Verisure — pontos fora dos limites (vermelhos) indicam causa especial: investigue o que mudou.</p>
</div>

<script>
  const API="https://ssolrvckfnchrwpnvegb.supabase.co/functions/v1/trabalhos-verisure";
  const FERRAMENTA="controle";
  const $=(id)=>document.getElementById(id);
  const GKEY="verisure_grupo";
  let D={ rotulo:"", valores:[] };

  try{ $("grupo").value=localStorage.getItem(GKEY)||""; }catch(e){}
  $("grupo").addEventListener("input",()=>{ try{localStorage.setItem(GKEY,$("grupo").value.trim());}catch(e){} });
  function status(m,ok){ $("status").textContent=m; $("status").style.color=ok===false?"var(--red)":"var(--muted)"; }
  $("rotulo").addEventListener("input",()=>{ D.rotulo=$("rotulo").value; draw(); });
  $("valores").addEventListener("input",()=>{ D.valores=parse($("valores").value); recalc(); });

  function parse(txt){ return String(txt).split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s!=="").map(Number).filter(n=>!isNaN(n)); }
  function fmt(n){ return (Math.round(n*100)/100).toString(); }

  function stats(){ const v=D.valores; const n=v.length; if(!n)return {n:0}; const mean=v.reduce((s,x)=>s+x,0)/n;
    const sd=n>1?Math.sqrt(v.reduce((s,x)=>s+(x-mean)*(x-mean),0)/(n-1)):0;
    return { n, mean, sd, ucl:mean+3*sd, lcl:mean-3*sd }; }

  function recalc(){ const s=stats();
    $("sN").textContent=s.n||0; $("sLC").textContent=s.n?fmt(s.mean):"–";
    $("sUCL").textContent=s.n?fmt(s.ucl):"–"; $("sLCL").textContent=s.n?fmt(s.lcl):"–";
    if(s.n){ const fora=D.valores.filter(x=>x>s.ucl||x<s.lcl).length;
      const a=$("alerta"); a.hidden=false; if(fora){ a.className="alerta bad"; a.textContent="⚠ "+fora+" ponto(s) fora dos limites — processo instável (causa especial)."; }
      else{ a.className="alerta ok"; a.textContent="✓ Todos os pontos dentro dos limites — processo sob controle."; } }
    else $("alerta").hidden=true;
    draw(); }

  function draw(){
    const c=$("chart"),ctx=c.getContext("2d"),W=900,H=500,dpr=window.devicePixelRatio||1;
    const cssW=c.clientWidth||W; c.width=W*dpr;c.height=H*dpr;c.style.height=(H*(cssW/W))+"px"; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const st=getComputedStyle(document.body);
    const col={ink:st.getPropertyValue('--ink'),muted:st.getPropertyValue('--muted'),line:st.getPropertyValue('--line'),teal:st.getPropertyValue('--teal')||'#2C8C89',navy:st.getPropertyValue('--navy')||'#132542',red:st.getPropertyValue('--red')||'#C0392B',amber:st.getPropertyValue('--amber-deep')||'#C7841F'};
    const s=stats(); const padL=54,padR=90,padT=30,padB=40, plotW=W-padL-padR, plotH=H-padT-padB;
    ctx.font='12px "IBM Plex Sans"';
    if(!s.n){ ctx.fillStyle=col.muted; ctx.textAlign="center"; ctx.fillText("Cole as medições ao lado para gerar o gráfico.",W/2,H/2); return; }
    const v=D.valores; let lo=Math.min(s.lcl,...v), hi=Math.max(s.ucl,...v); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;
    const X=(i)=>padL+(v.length===1?plotW/2:plotW*i/(v.length-1)); const Y=(val)=>padT+plotH-((val-lo)/(hi-lo))*plotH;
    // eixos
    ctx.strokeStyle=col.line; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+plotH); ctx.lineTo(padL+plotW,padT+plotH); ctx.stroke();
    // linha de controle + limites
    function refline(val,color,label,dash){ const y=Y(val); ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=color; ctx.textAlign="left"; ctx.font='bold 11px "IBM Plex Mono"'; ctx.fillText(label+" "+fmt(val),padL+plotW+6,y+4); }
    refline(s.ucl,col.red,"LSC",[6,4]); refline(s.lcl,col.red,"LIC",[6,4]); refline(s.mean,col.navy,"LC",[]);
    // linha de dados
    ctx.strokeStyle=col.teal; ctx.lineWidth=2.4; ctx.beginPath(); v.forEach((val,i)=>{ const x=X(i),y=Y(val); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    // pontos
    v.forEach((val,i)=>{ const x=X(i),y=Y(val); const fora=val>s.ucl||val<s.lcl; ctx.fillStyle=fora?col.red:col.teal; ctx.beginPath(); ctx.arc(x,y,fora?6:4.5,0,7); ctx.fill(); if(fora){ ctx.strokeStyle=col.red; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.stroke(); }
      ctx.fillStyle=col.muted; ctx.font='9px "IBM Plex Mono"'; ctx.textAlign="center"; ctx.fillText(i+1,x,padT+plotH+14); });
    // titulo eixo
    ctx.fillStyle=col.ink; ctx.font='bold 12px "IBM Plex Sans"'; ctx.textAlign="left"; ctx.fillText(D.rotulo||"Medições",padL,padT-12);
  }
  window.addEventListener("resize",draw);

  async function api(p){ const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)}); return r.json().catch(()=>({ok:false})); }
  async function salvar(){ const g=$("grupo").value.trim(); if(!g){status("informe o grupo",false);return;} $("salvar").disabled=true; status("salvando…"); const o=await api({action:"save",grupo:g,ferramenta:FERRAMENTA,dados:D}); status(o.ok?"salvo ✓":"erro",o.ok); $("salvar").disabled=false; }
  async function carregar(){ const g=$("grupo").value.trim(); if(!g){status("informe o grupo",false);return;} status("carregando…"); const o=await api({action:"get",grupo:g,ferramenta:FERRAMENTA}); const d=o.dados;
    if(o.ok&&d&&Array.isArray(d.valores)){ D={rotulo:d.rotulo||"",valores:d.valores.map(Number).filter(n=>!isNaN(n))}; $("rotulo").value=D.rotulo; $("valores").value=D.valores.join("\n"); recalc(); status("carregado ✓"); }
    else status("nada salvo p/ este grupo"); }
  function png(){ const a=document.createElement("a"); a.href=$("chart").toDataURL("image/png"); a.download=("controle_"+($("grupo").value.trim()||"grupo")+".png").replace(/\s+/g,"_"); a.click(); }

  $("salvar").addEventListener("click",salvar);
  $("carregar").addEventListener("click",carregar);
  $("png").addEventListener("click",png);
  $("imprimir").addEventListener("click",()=>window.print());
  $("limpar").addEventListener("click",()=>{ if(confirm("Limpar tudo?")){ D={rotulo:"",valores:[]}; $("rotulo").value=""; $("valores").value=""; recalc(); } });

  // exemplo inicial
  D={ rotulo:"Tempo de atendimento (min)", valores:[12,14,11,13,12,15,13,22,12,11,14,13,12,10,13] };
  $("rotulo").value=D.rotulo; $("valores").value=D.valores.join("\n"); recalc();
</script>
</body>
</html>
