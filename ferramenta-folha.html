<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folha de Verificação · Ferramentas Verisure</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0E1729; --ink-2:#33415A; --muted:#647089; --paper:#F4F6FA; --card:#FFFFFF; --line:#E4E9F1;
    --navy:#132542; --amber:#E8A33D; --amber-deep:#C7841F; --teal:#2C8C89; --red:#C0392B; --shadow:0 16px 40px -22px rgba(15,23,41,.35); }
  @media (prefers-color-scheme: dark){ :root{ --ink:#E9EEF6; --ink-2:#B9C5D8; --muted:#8598B2; --paper:#0A111E; --card:#131E33; --line:#233248; --navy:#0E1B30; } }
  *{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:20px}
  h1{font-family:"Bricolage Grotesque",sans-serif;margin:0;font-size:20px}
  header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mk{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:rgba(44,140,137,.15);color:var(--teal)}
  .brand p{margin:0;color:var(--muted);font-size:12.5px}
  .grpbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .grpbar label{font-size:12px;color:var(--muted);font-weight:600}
  .grpbar input{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--ink);width:150px}
  .grpbar input:focus{outline:none;border-color:var(--amber)}
  #status{font-size:12px;color:var(--muted);min-width:80px}
  .btn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:10px 14px}
  .btn.primary{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#20160A}
  .btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink-2)}
  .btn.sm{font-size:13px;padding:9px 11px}
  .board{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  .fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .fld label{font-size:11px;font-weight:700;color:var(--muted)}
  .fld input{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink)}
  .fld input:focus{outline:none;border-color:var(--amber)}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  th,td{border:1px solid var(--line);padding:5px 7px}
  thead th{background:var(--navy);color:#EAF0F8;font-weight:600;font-size:12px}
  thead th input{width:100%;background:transparent;border:none;color:#EAF0F8;font:inherit;font-weight:600;font-size:12px;text-align:center}
  thead th input:focus{outline:1px solid var(--amber);border-radius:5px}
  thead th.corner{background:var(--navy-2,#0B1526);min-width:150px}
  td.rowlbl input{width:100%;border:none;background:transparent;font:inherit;font-size:12.5px;color:var(--ink);font-weight:500}
  td.rowlbl input:focus{outline:none}
  td.cell input{width:100%;border:none;background:transparent;font:inherit;font-size:13px;text-align:center;color:var(--ink);font-family:"IBM Plex Mono",monospace}
  td.cell input:focus{outline:1px solid var(--amber);border-radius:5px}
  td.cell{cursor:pointer}
  td.tot{background:rgba(232,163,61,.1);font-weight:700;text-align:center;font-family:"IBM Plex Mono",monospace}
  tfoot td{background:rgba(19,37,66,.06);font-weight:700;text-align:center;font-family:"IBM Plex Mono",monospace}
  tfoot td.lbl{text-align:right;font-family:inherit}
  td.del{border:none;width:26px;text-align:center;padding:0}
  td.del button{border:none;background:transparent;color:var(--red);cursor:pointer;font-size:15px;opacity:.6}
  td.del button:hover{opacity:1}
  .addrow{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
  .actions .sp{flex:1}
  .hinttip{font-size:12px;color:var(--muted);margin-top:8px}
  .foot{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}
  @media print{ .noprint{display:none!important} body{background:#fff} .wrap{max-width:100%;padding:0}
    .board{box-shadow:none;border:none} thead th,tfoot td,td.tot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:A4 landscape;margin:12mm} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div class="brand"><span class="mk">☑</span><div><h1>Folha de Verificação</h1><p>Conte as ocorrências de forma organizada · Bloco GQT</p></div></div>
    <div class="grpbar"><label for="grupo">Grupo</label><input id="grupo" placeholder="Ex.: Grupo Azul" autocomplete="off"><span id="status"></span></div>
  </header>

  <div class="board" id="board">
    <div class="fld"><label for="titulo">O que estamos verificando?</label>
      <input id="titulo" placeholder="Ex.: Tipos de defeito na expedição — semana 1"></div>
    <div class="tablewrap"><table id="tbl"></table></div>
    <div class="addrow noprint">
      <button class="btn ghost sm" id="addItem">+ Item (linha)</button>
      <button class="btn ghost sm" id="addCol">+ Período (coluna)</button>
    </div>
    <p class="hinttip noprint">Dica: clique numa célula para somar <b>+1</b> (contagem rápida) ou digite o número direto.</p>
  </div>

  <div class="actions noprint">
    <span class="sp"></span>
    <button class="btn primary" id="salvar">Salvar</button>
    <button class="btn ghost sm" id="carregar">Carregar</button>
    <button class="btn ghost sm" id="png">Baixar PNG</button>
    <button class="btn ghost sm" id="imprimir">Imprimir / PDF</button>
    <button class="btn ghost sm" id="limpar">Limpar</button>
  </div>
  <p class="foot noprint">Ferramentas do Workshop · Verisure — dados coletados com clareza são a base de todas as outras ferramentas.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const API="https://ssolrvckfnchrwpnvegb.supabase.co/functions/v1/trabalhos-verisure";
  const FERRAMENTA="folha";
  const $=(id)=>document.getElementById(id);
  const GKEY="verisure_grupo";
  let D={ titulo:"", colunas:["Seg","Ter","Qua","Qui","Sex"], itens:[] };

  try{ $("grupo").value=localStorage.getItem(GKEY)||""; }catch(e){}
  $("grupo").addEventListener("input",()=>{ try{localStorage.setItem(GKEY,$("grupo").value.trim());}catch(e){} });
  function status(m,ok){ $("status").textContent=m; $("status").style.color=ok===false?"var(--red)":"var(--muted)"; }
  function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  $("titulo").addEventListener("input",()=>{ D.titulo=$("titulo").value; });

  function newItem(nome){ return { nome:nome||"", c:D.colunas.map(()=>0) }; }
  function normalize(){ D.itens.forEach(it=>{ while(it.c.length<D.colunas.length)it.c.push(0); it.c.length=D.colunas.length; }); }

  function render(){
    normalize();
    const head=`<thead><tr><th class="corner">Item \\ Período</th>${D.colunas.map((c,ci)=>`<th><input data-col="${ci}" value="${esc(c)}"></th>`).join("")}<th style="min-width:56px">Total</th><th class="noprint" style="border:none;width:26px"></th></tr></thead>`;
    const body=`<tbody>${D.itens.map((it,ri)=>{ const tot=it.c.reduce((s,v)=>s+(+v||0),0);
      return `<tr>
        <td class="rowlbl"><input data-row="${ri}" value="${esc(it.nome)}" placeholder="tipo/ocorrência…"></td>
        ${it.c.map((v,ci)=>`<td class="cell" data-cellr="${ri}" data-cellc="${ci}"><input type="number" min="0" data-vr="${ri}" data-vc="${ci}" value="${v}"></td>`).join("")}
        <td class="tot">${tot}</td>
        <td class="del noprint"><button data-delrow="${ri}" title="Remover">×</button></td>
      </tr>`; }).join("")}</tbody>`;
    const colTot=D.colunas.map((_,ci)=>D.itens.reduce((s,it)=>s+(+it.c[ci]||0),0));
    const grand=colTot.reduce((s,v)=>s+v,0);
    const foot=`<tfoot><tr><td class="lbl">Total do período</td>${colTot.map(v=>`<td>${v}</td>`).join("")}<td class="tot">${grand}</td><td class="noprint" style="border:none"></td></tr></tfoot>`;
    $("tbl").innerHTML=head+body+foot;
    // eventos
    $("tbl").querySelectorAll('input[data-col]').forEach(i=>i.addEventListener("input",()=>{ D.colunas[+i.dataset.col]=i.value; }));
    $("tbl").querySelectorAll('input[data-row]').forEach(i=>i.addEventListener("input",()=>{ D.itens[+i.dataset.row].nome=i.value; }));
    $("tbl").querySelectorAll('input[data-vr]').forEach(i=>i.addEventListener("input",()=>{ D.itens[+i.dataset.vr].c[+i.dataset.vc]=Math.max(0,parseInt(i.value)||0); render(); i.blur(); }));
    $("tbl").querySelectorAll('td.cell').forEach(td=>td.addEventListener("click",e=>{ if(e.target.tagName==="INPUT")return; const r=+td.dataset.cellr,c=+td.dataset.cellc; D.itens[r].c[c]=(+D.itens[r].c[c]||0)+1; render(); }));
    $("tbl").querySelectorAll('button[data-delrow]').forEach(b=>b.addEventListener("click",()=>{ D.itens.splice(+b.dataset.delrow,1); if(!D.itens.length)D.itens.push(newItem()); render(); }));
  }

  $("addItem").addEventListener("click",()=>{ D.itens.push(newItem()); render(); });
  $("addCol").addEventListener("click",()=>{ D.colunas.push("Nov"); D.itens.forEach(it=>it.c.push(0)); render(); });

  async function api(p){ const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)}); return r.json().catch(()=>({ok:false})); }
  async function salvar(){ const g=$("grupo").value.trim(); if(!g){status("informe o grupo",false);return;} $("salvar").disabled=true; status("salvando…"); const o=await api({action:"save",grupo:g,ferramenta:FERRAMENTA,dados:D}); status(o.ok?"salvo ✓":"erro",o.ok); $("salvar").disabled=false; }
  async function carregar(){ const g=$("grupo").value.trim(); if(!g){status("informe o grupo",false);return;} status("carregando…"); const o=await api({action:"get",grupo:g,ferramenta:FERRAMENTA}); const d=o.dados;
    if(o.ok&&d&&Array.isArray(d.itens)){ D={titulo:d.titulo||"",colunas:Array.isArray(d.colunas)&&d.colunas.length?d.colunas:["Seg","Ter","Qua","Qui","Sex"],itens:d.itens.map(x=>({nome:x.nome||"",c:Array.isArray(x.c)?x.c.map(v=>+v||0):[]}))};
      if(!D.itens.length)D.itens.push(newItem()); $("titulo").value=D.titulo; render(); status("carregado ✓"); }
    else status("nada salvo p/ este grupo"); }
  async function png(){ status("gerando imagem…"); const bg=getComputedStyle(document.body).getPropertyValue('--card')||'#fff';
    try{ const cv=await html2canvas($("board"),{scale:2,backgroundColor:bg.trim()||"#fff"}); const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download=("folha_"+($("grupo").value.trim()||"grupo")+".png").replace(/\s+/g,"_"); a.click(); status(""); }catch(e){ status("use Imprimir/PDF",false); } }

  $("salvar").addEventListener("click",salvar);
  $("carregar").addEventListener("click",carregar);
  $("png").addEventListener("click",png);
  $("imprimir").addEventListener("click",()=>window.print());
  $("limpar").addEventListener("click",()=>{ if(confirm("Limpar a folha?")){ D={titulo:"",colunas:["Seg","Ter","Qua","Qui","Sex"],itens:[newItem(),newItem(),newItem()]}; $("titulo").value=""; render(); } });

  // exemplo inicial
  D={ titulo:"Tipos de defeito na expedição — semana 1", colunas:["Seg","Ter","Qua","Qui","Sex"], itens:[
    {nome:"Etiqueta errada", c:[3,2,4,1,2]},
    {nome:"Volume trocado", c:[1,0,2,1,3]},
    {nome:"Atraso na coleta", c:[2,3,1,2,4]},
    {nome:"Embalagem danificada", c:[0,1,1,0,2]}
  ]};
  $("titulo").value=D.titulo; render();
</script>
</body>
</html>
